[project]
name = "nooa-coding"
version = "0.1.0"
description = "A production-oriented, single-user coding agent built on NVIDIA NOOA"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1",
    "nooa[mcp]>=0.0.8",
    "nooa-cli[ast]>=0.0.8",
    "nooa-memory>=0.0.8",
    "prompt-toolkit>=3.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "mcp>=1,<2",
]

[project.scripts]
nooa-code = "nooa_coding.cli:main"

# NOOA packages are consumed from PyPI (>=0.0.8). To pin a specific git rev instead,
# add entries under [tool.uv.sources] pointing to the NVIDIA-NeMo/labs-OO-Agents repo.
# Upgrade: `uv lock --upgrade-package nooa --upgrade-package nooa-cli --upgrade-package nooa-memory`
# then run the compatibility suite.

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "python-semantic-release>=9.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nooa_coding"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]

# Automated versioning: versions are derived from Conventional Commits
# (feat -> minor, fix -> patch, BREAKING CHANGE -> major). Run
# `uv run semantic-release version` to bump pyproject.toml, update
# CHANGELOG.md, and tag the release. Publishing stays manual.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# 0.x development phase: stay below 1.0 until a breaking change is
# intentionally promoted; breaking changes on 0.x bump the minor digit.
allow_zero_version = true
major_on_zero = false
build_command = ""
tag_format = "v{version}"
commit_author = "NOOA Release Bot <nooa-coding@localhost>"

[tool.semantic_release.publish]
upload_to_vcs_release = false
